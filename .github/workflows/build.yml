name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Download Gradle wrapper files
      run: |
        mkdir -p gradle/wrapper
        
        # Download gradle-wrapper.properties
        curl -L https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties
        
        # Download gradle-wrapper.jar
        curl -L https://repo.gradle.org/gradle/distributions/gradle-8.1-wrapper.zip -o gradle-wrapper.zip
        unzip -j gradle-wrapper.zip "gradle-8.1/gradle/wrapper/gradle-wrapper.jar" -d gradle/wrapper/
        rm gradle-wrapper.zip
        
        # Download gradlew scripts
        curl -L https://raw.githubusercontent.com/gradle/gradle/master/gradlew -o gradlew
        curl -L https://raw.githubusercontent.com/gradle/gradle/master/gradlew.bat -o gradlew.bat
        
        chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
